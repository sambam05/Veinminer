name: Test Matrix

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  mod-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: fabric
            project_dir: VMM-fabric-v1.21.11
            minecraft_target: 1_21_11
          - loader: neoforge
            project_dir: VMM-neoforge-v1.21.11
            minecraft_target: 1_21_11

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run tests (${{ matrix.loader }})
        working-directory: ${{ matrix.project_dir }}
        run: |
          chmod +x gradlew
          ./gradlew test -Pminecraft_target=${{ matrix.minecraft_target }} --console=plain --no-daemon
